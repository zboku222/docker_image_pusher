name: Docker Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.IYUN_NAME_SPACE }}"   # ← 确认你 secret 名就是这个
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  sync:
    name: Pull & Push
    runs-on: ubuntu-latest
    steps:

    # ── 1. 拉代码 ────────────────────────────────────
    - name: Checkout Code
      uses: actions/checkout@v4

    # ── 2. 修复 images.txt 换行符（CRLF → LF）──────
    - name: Normalize images.txt
      run: |
        sed -i 's/\r$//' images.txt
        echo "=== images.txt ==="
        cat -n images.txt

    # ── 3. 最大化磁盘空间（全开）────────────────────
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        remove-android: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Disk space check
      run: df -hT

    # ── 4. Docker 环境 ───────────────────────────────
    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Aliyun Registry (secure stdin)
      run: |
        echo "$ALIYUN_REGISTRY_PASSWORD" | docker login \
          -u "$ALIYUN_REGISTRY_USER" \
          --password-stdin \
          "$ALIYUN_REGISTRY"

    # ── 5. 核心：拉取 → 改名 → 推送 ─────────────────
    - name: Pull and push images
      run: |
        set -euo pipefail

        # ── 5a. 预扫描：找出重名镜像 ──
        declare -A seen_name_space
        declare -A dup_names

        while IFS= read -r raw || [ -n "$raw" ]; do
          line="$(echo "$raw" | xargs)"   # 去首尾空格
          [[ -z "$line" ]] && continue
          [[ "$line" =~ ^# ]] && continue

          full="$(echo "$line" | awk '{print $NF}')"
          full="${full%%@*}"
          img_name="$(echo "$full" | awk -F'/' '{print $NF}' | cut -d: -f1)"
          ns="$(echo "$full" | awk -F'/' '{if(NF==3)print $2; else if(NF==2)print $1; else print ""}')"

          if [[ -n "${seen_name_space[$img_name]:-}" ]] && \
             [[ "${seen_name_space[$img_name]}" != "$ns" ]]; then
            dup_names[$img_name]="1"
          fi
          seen_name_space[$img_name]="$ns"
        done < images.txt

        # ── 5b. 逐行处理 ──
        while IFS= read -r raw || [ -n "$raw" ]; do
          line="$(echo "$raw" | xargs)"
          [[ -z "$line" ]] && continue
          [[ "$line" =~ ^# ]] && continue

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ">>> Processing: $line"

          # 解析 --platform 参数
          platform="$(echo "$line" | grep -oP '(?<=--platform[= ])\S+' | head -1 || true)"
          echo "Platform: [${platform:-none}]"

          # Pull（--quiet 防止日志撑爆磁盘）
          # shellcheck disable=SC2086
          docker pull --quiet $line

          # 提取镜像信息
          full="$(echo "$line" | awk '{print $NF}')"
          full="${full%%@*}"
          img_name_tag="$(echo "$full" | awk -F'/' '{print $NF}')"
          img_name="$(echo "$img_name_tag" | cut -d: -f1)"
          img_tag="$(echo "$img_name_tag" | cut -d: -f2-)"
          [[ "$img_tag" == "$img_name" ]] && img_tag="latest"

          ns="$(echo "$full" | awk -F'/' '{if(NF==3)print $2; else if(NF==2)print $1; else print ""}')"

          # ── 安全拼接前缀（核心修复）──
          prefix_parts=()

          if [[ -n "$platform" ]]; then
            prefix_parts+=("${platform//\//_}")
          fi

          if [[ -n "${dup_names[$img_name]:-}" ]] && [[ -n "$ns" ]]; then
            prefix_parts+=("$ns")
          fi

          # 用 - 连接前缀，避免下划线打头或双下划线
          if [[ ${#prefix_parts[@]} -gt 0 ]]; then
            joined="$(IFS=- ; echo "${prefix_parts[*]}")"
            target_repo="${joined}-${img_name}"
          else
            target_repo="${img_name}"
          fi

          new_image="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${target_repo}:${img_tag}"

          echo "Source : $full"
          echo "Target : $new_image"

          # 语法守卫
          if ! echo "$new_image" | grep -Eq '^[a-z0-9._-]+/[a-z0-9._/-]+:[a-zA-Z0-9_.-]+$'; then
            echo "::error::Invalid reference: $new_image"
            exit 1
          fi

          docker tag "$full" "$new_image"
          docker push "$new_image"

          # ── 立即清理，防止磁盘累积 ──
          docker rmi "$full" "$new_image" 2>/dev/null || true
          docker system prune -f

          echo "--- Disk after ---"
          df -hT / /var/lib/docker 2>/dev/null || df -hT

        done < images.txt

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ All images synced."
