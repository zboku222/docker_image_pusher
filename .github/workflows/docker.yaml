name: Docker Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  sync:
    name: Pull & Push
    runs-on: ubuntu-latest
    steps:

    # ══════════════════════════════════════════════════
    # 第 0 步：校验变量（第一个跑，失败则后续全跳过）
    # ══════════════════════════════════════════════════
    - name: Validate required secrets
      run: |
        echo "🔍 Validating required environment variables..."
        echo ""

        : "${ALIYUN_REGISTRY:?❌ ALIYUN_REGISTRY is empty! Go to Settings → Secrets and add it.}"
        : "${ALIYUN_NAME_SPACE:?❌ ALIYUN_NAME_SPACE is empty! Go to Settings → Secrets and add it.}"
        : "${ALIYUN_REGISTRY_USER:?❌ ALIYUN_REGISTRY_USER is empty! Go to Settings → Secrets and add it.}"
        : "${ALIYUN_REGISTRY_PASSWORD:?❌ ALIYUN_REGISTRY_PASSWORD is empty! Go to Settings → Secrets and add it.}"

        echo "✅ ALIYUN_REGISTRY       = $ALIYUN_REGISTRY"
        echo "✅ ALIYUN_NAME_SPACE     = $ALIYUN_NAME_SPACE"
        echo "✅ ALIYUN_REGISTRY_USER  = $ALIYUN_REGISTRY_USER"
        echo "✅ ALIYUN_REGISTRY_PASSWORD = (hidden, length=${#ALIYUN_REGISTRY_PASSWORD})"
        echo ""
        echo "All required variables are present. Proceeding..."

    # ══════════════════════════════════════════════════
    # 后续步骤（只有上面通过了才会执行）
    # ══════════════════════════════════════════════════
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Normalize images.txt
      run: |
        sed -i 's/\r$//' images.txt
        echo "=== images.txt ==="
        cat -n images.txt


    - name: Restart docker
      run: sudo service docker restart

    - name: Disk space check
      run: df -hT


    - name: Login to Aliyun Registry
      run: |
        echo "$ALIYUN_REGISTRY_PASSWORD" | docker login \
          -u "$ALIYUN_REGISTRY_USER" \
          --password-stdin \
          "$ALIYUN_REGISTRY"



    - name: Pull and push images
      env:
        # 将 Secret 赋值给普通环境变量，绕过 GitHub 的自动脱敏替换
        REG: ${{ secrets.ALIYUN_REGISTRY }}
        NS: ${{ secrets.ALIYUN_NAME_SPACE }}
        USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
        PASS: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      run: |
        set -euo pipefail

        # ── 防空校验 ──
        : "${REG:?❌ ALIYUN_REGISTRY is empty!}"
        : "${NS:?❌ ALIYUN_NAME_SPACE is empty!}"
        : "${USER:?❌ ALIYUN_REGISTRY_USER is empty!}"
        : "${PASS:?❌ ALIYUN_REGISTRY_PASSWORD is empty!}"

        echo "Registry:  $REG"
        echo "Namespace: $NS"

        while IFS= read -r raw || [ -n "$raw" ]; do
          line="$(echo "$raw" | xargs)"
          [[ -z "$line" ]] && continue
          [[ "$line" =~ ^# ]] && continue

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ">>> Processing: $line"

          platform="$(echo "$line" | grep -oP '(?<=--platform[= ])\S+' | head -1 || true)"

          # shellcheck disable=SC2086
          docker pull --quiet $line

          full="$(echo "$line" | awk '{print $NF}')"
          full="${full%%@*}"
          img_name_tag="$(echo "$full" | awk -F'/' '{print $NF}')"
          img_name="$(echo "$img_name_tag" | cut -d: -f1)"
          img_tag="$(echo "$img_name_tag" | cut -d: -f2-)"
          [[ "$img_tag" == "$img_name" ]] && img_tag="latest"

          # 使用普通环境变量明文拼接，避免脱敏
          new_image="${REG}/${NS}/${img_name}:${img_tag}"

          echo "Target : $new_image"

          # 语法守卫
          if ! echo "$new_image" | grep -Eq '^[^/]+/[^/]+/[^:]+:[^:]+$'; then
            echo "::error::Invalid reference: $new_image"
            exit 1
          fi

          docker tag "$full" "$new_image"
          docker push "$new_image"
          
          # ✅ 推送完成后打印完整镜像名
          echo "✅ Pushed: $new_image"

          docker rmi "$full" "$new_image" 2>/dev/null || true
          docker system prune -f
          df -hT

        done < images.txt

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ All done."
        # ✅ 最终结束前再次打印最后一个镜像名
        echo "📋 Final pushed image: $new_image"
